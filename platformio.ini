[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino
build_src_filter =
    -<*>
    +<main.cpp>
    +<p4_control.cpp>
    +<p4_display.cpp>
    +<p4_gif.cpp>
    +<p4_runtime.cpp>
    +<p4_show_format.cpp>
    +<p4_show_player.cpp>
    +<p4_storage.cpp>
    +<p4_upload_ui.cpp>
    +<p4_web.cpp>

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 32MB
board_build.partitions = partitions_32MB.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHTTP_UPLOAD_BUFLEN=16384

[env:esp32p4-benchmark]
extends = env:esp32p4
build_src_filter =
    ${env:esp32p4.build_src_filter}
    +<p4_jpeg_benchmark.cpp>
    +<p4_jpeg_benchmark_assets.cpp>
build_flags =
    ${env:esp32p4.build_flags}
    -DZNACHOK_JPEG_BENCHMARK=1
    -DZNACHOK_JPEG_BENCHMARK_FRAMES=36000
    -DZNACHOK_JPEG_BENCHMARK_MMAP=1

[env:esp32p4-contract-test]
extends = env:esp32p4
build_src_filter =
    ${env:esp32p4.build_src_filter}
    +<p4_show_contract_fixture.cpp>
    +<p4_show_contract_test.cpp>
build_flags =
    ${env:esp32p4.build_flags}
    -DZNACHOK_SHOW_CONTRACT_TEST=1
